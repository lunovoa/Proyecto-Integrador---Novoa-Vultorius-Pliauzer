<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="./css/styles.css">

</head>
<body>
    <header>

        <div class="containerlogo">
            <a href="./index.html"><img src="./img/runik.jpg" alt="imagen del logo de la marca" class="logo"></a> 
         <h1 class="titulo">RUNIK</h1> 
        </div>

        <nav class="container">
            <ul class="navegador">
                <li><a href="./index.html">HOME</a></li>
                <li><a href="./register.html">REGISTRARSE</a></li>
                <li><a href="./login.html">LOGIN</a></li>  
            </ul> 
        </nav>

        <form action="./search-results.html" method="get" class="buscador">
            <input type="textarea" name="category" value="" placeholder="¿Que estas buscando?">
            <label>🔎</label>
        </form>

    </header>

    <main>
        <section class="registro">
            <form action="./login.html" method="get" class="formulario-registro">

                <h2>Crear cuenta</h2>

                <div class="mail-registro">
                    <label for="mail">Mail:</label>
                    <input type="email" id="mail" name="mail" value="" required>
                </div>

                <div class="password-registro">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="pass" value="" required>
                </div>

                <div class="password2-registro">
                    <label for="password2">Repetir contraseña:</label>
                    <input type="password" id="password2" name="pass2" value="" required>
                </div>

                <div class="terminos-registro">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto términos y condiciones</label>
                </div>

                <div class="registrarme-registro">
                    <button type="submit">Registrarme</button>
                </div>

                <div class="ya-tengo-cuenta-registro">
                    <a href="./login.html">Ya tengo una cuenta</a>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p class="nombres">Novoa · Vultorius · Pliauzer</p>
    </footer>

</body>
</html>
